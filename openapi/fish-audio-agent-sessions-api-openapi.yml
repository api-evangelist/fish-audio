        `selected` when the caller chose an option, `no_input` or `no_match`

        when no attempt got a valid choice (the last one had no input, or input

        matching no option), and `skipped` when the menu could not run (a resumed

        conversation or no SIP caller). `value` is what the menu variable

        received: the chosen option''s value, or the fallback value when the

        caller never made a valid choice.'
