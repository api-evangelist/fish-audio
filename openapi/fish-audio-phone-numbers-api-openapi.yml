                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
      tags:
      - Phone Numbers
      operationId: getV1AgentPhoneNumbers
      x-operation-id-source: derived
    post:
      summary: Purchase or Import Phone Number
      description: '`provider` discriminates two variants. `twilio` buys a number from the

        managed inventory: it lands in your default workspace, any `agent_id` you

        bind must live there too, and billing is the monthly price charged in

        daily slices; the first day is charged before anything is bought (402

        costs you nothing) and the daily run advances it from there. `sip`

        imports a number you already own at your carrier: point your trunk''s

        origination at our SIP host, provide inbound authentication (digest

        and/or source CIDRs) and optionally a termination host so the number can

        place calls; nothing is rented and there is no monthly fee. Either way,

        409 means the number is already on the platform; 502 means the provider

        or trunk provisioning refused, and the number stays visible with status

        `error` and is safe to release.'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/PublicPhoneNumberPurchasePayload'
              - $ref: '#/components/schemas/PublicSipNumberImportPayload'
      responses:
        '201':
          description: Document created, URL follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  phone_number_id:
                    title: Phone Number Id
                    type: string
                  workspace_id:
                    title: Workspace Id
                    type: string
                  phone_number:
                    description: E.164, e.g. +14155550123.
                    title: Phone Number
                    type: string
                  provider:
                    enum:
                    - livekit
                    - twilio
                    - sip
                    title: Provider
                    type: string
                  label:
                    default: ''
                    title: Label
                    type: string
                  agent_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: Inbound calls route to this agent; unbound numbers ring busy.
                    title: Agent Id
                  transfer_caller_id:
                    anyOf:
                    - enum:
                      - agent_number
                      - original_caller
                      type: string
                    - type: 'null'
                    default: null
                    description: 'Managed `twilio` numbers: the caller ID a transfer target sees, on cold and warm transfers alike. `agent_number` shows this number, `original_caller` shows the caller''s own number (a warm transfer falls back to this number when the caller withholds theirs). `null` for imported `sip` numbers, whose carrier decides.'
                    title: Transfer Caller Id
                  cold_transfer_use_original_caller:
                    anyOf:
                    - type: boolean
                    - type: 'null'
                    default: null
                    deprecated: true
                    description: Deprecated, read `transfer_caller_id`. True when it is `original_caller`.
                    title: Cold Transfer Use Original Caller
                  cold_transfer_use_original_caller_effective:
                    anyOf:
                    - type: boolean
                    - type: 'null'
                    default: null
                    deprecated: true
                    description: Deprecated, read `caller_id_sync_status`. Whether the carrier has confirmed the original caller policy for cold transfers, `null` while unknown.
                    title: Cold Transfer Use Original Caller Effective
                  caller_id_sync_status:
                    default: carrier_managed
                    description: '`synced` once the carrier confirmed the policy, `pending` while it is being applied, `error` when the last attempt failed (send `retry_caller_id_sync`), `carrier_managed` for imported `sip` numbers.'
                    enum:
                    - synced
                    - pending
                    - error
                    - carrier_managed
                    title: Caller Id Sync Status
                    type: string
                  caller_id_sync_error:
                    default: ''
                    description: Why the last synchronization failed; empty otherwise.
                    title: Caller Id Sync Error
                    type: string
                  status:
                    enum:
                    - provisioning
                    - active
                    - error
                    - released
                    title: Status
                    type: string
                  status_detail:
                    default: ''
                    description: What failed when status is `error`; empty otherwise.
                    title: Status Detail
                    type: string
                  supports_outbound:
                    default: false
                    description: 'Whether the number can place calls (outbound and warm-transfer consult legs): managed `twilio` always, imported `sip` only when a termination was configured.'
                    title: Supports Outbound
                    type: boolean
                  termination_uri:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    description: 'Imported `sip` numbers: the customer trunk''s termination host.'
                    title: Termination Uri
                  inbound_auth_username:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    description: 'Imported `sip` numbers: the inbound digest username. Passwords are never echoed.'
                    title: Inbound Auth Username
                  inbound_allowed_addresses:
                    description: 'Imported `sip` numbers: allowed source IPs/CIDRs.'
                    items:
                      type: string
                    title: Inbound Allowed Addresses
                    type: array
                  termination_transport:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    description: 'Imported `sip` numbers: termination transport.'
                    title: Termination Transport
                  termination_auth_username:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    description: 'Imported `sip` numbers: the termination digest username. Passwords are never echoed.'
                    title: Termination Auth Username
                  termination_headers:
                    additionalProperties:
                      type: string
                    description: 'Imported `sip` numbers: custom SIP headers added to every outbound INVITE through the termination.'
                    title: Termination Headers
                    type: object
                  created_at:
                    format: date-time
                    title: Created At
                    type: string
                  updated_at:
                    format: date-time
                    title: Updated At
                    type: string
                required:
                - phone_number_id
                - workspace_id
                - phone_number
                - provider
                - agent_id
                - status
                - created_at
                - updated_at
                type: object
        '401':
          description: No permission -- see authorization schemes
          headers: {}
          content:
            application/json:
              schema:
                properties:
