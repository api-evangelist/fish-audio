    patch:
      summary: Update Tool
      description: 'Patch tool fields; omitted fields keep their value (null is rejected —

        send an empty string to clear a text field). `headers` replaces the header

        list wholesale — include credential values again whenever you send it,

        since reads never return them. Attached agents'' drafts pick up the change

        immediately; published versions stay frozen until re-published.'
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: tool_id
        description: ''
        required: true
        schema:
          title: Tool Id
          type: string
        deprecated: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAgentToolUpdatePayload'
      responses:
