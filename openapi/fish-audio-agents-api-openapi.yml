    AgentTransferDestination:
      properties:
        type:
          default: phone
          enum:
          - phone
          - sip
          title: Type
          type: string
        label:
          default: ''
          title: Label
          type: string
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Phone Number
        sip_uri:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Sip Uri
        description:
          default: ''
          title: Description
          type: string
        mode:
          default: cold
          enum:
          - cold
          - warm
          title: Mode
          type: string
        warm_connect:
          default: confirm
          enum:
          - confirm
          - briefing
          - direct
          title: Warm Connect
          type: string
        warm_briefing_instructions:
          default: ''
          title: Warm Briefing Instructions
          type: string
        warm_ring_timeout_seconds:
          default: 30
          title: Warm Ring Timeout Seconds
          type: integer
        warm_confirm_timeout_seconds:
          default: 60
          title: Warm Confirm Timeout Seconds
          type: integer
        warm_human_detection:
          default: false
          description: Applies to warm transfers whose warm_connect is `confirm` or `briefing`, and is ignored for cold transfers and `direct`. When true, once the destination answers, the agent stays silent until the other side speaks, then classifies the pickup. A person is briefed as usual. Voicemail or an IVR (phone menu) ends the transfer as failed. A hold queue or silence keeps the agent waiting until `warm_confirm_timeout_seconds` ends the attempt as unreachable. A failed transfer follows `on_failure`. Leave it off for destinations whose people are only reachable through a phone menu, because the menu stops the transfer.
          title: Warm Human Detection
          type: boolean
        on_failure:
          $ref: '#/components/schemas/AgentTransferOnFailure'
        announcement_mode:
          default: generated
          enum:
          - generated
          - fixed
          - 'off'
          title: Announcement Mode
          type: string
        announcement_message:
          default: ''
          title: Announcement Message
          type: string
      title: AgentTransferDestination
      type: object
    AgentEchoGuard:
      description: 'Echo guard per call channel: true on, false off, null uses the default.'
      properties:
        web_voice:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Voice calls in a browser or app (web widget, SDK, test calls). Null uses the default (on).
          title: Web Voice
        phone_inbound:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Inbound phone calls. Null uses the default (on).
          title: Phone Inbound
        phone_outbound:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Outbound phone calls. Null uses the default (off).
          title: Phone Outbound
      title: AgentEchoGuard
      type: object
    PublicAgentAsrConfig:
      description: 'The asr section as the public API reads it: without the console-only

        noise cancellation and speaker label switches.'
      properties:
        model:
          default: deepgram:nova-3
          enum:
          - deepgram:nova-3
          - elevenlabs:scribe_v2_realtime
          - elevenlabs:scribe_v2_medical
          - fish_audio:transcribe-1-pro-realtime
          title: Model
          type: string
        multilingual:
          default: false
          title: Multilingual
          type: boolean
        strict_language:
          default: false
          description: 'Enforces voice.speaking_language whatever multilingual says: speech recognized as another language reaches the agent as [unintelligible speech]. Language is detected per utterance, so a short or heavily accented phrase in the speaking language can occasionally be detected as another language and replaced too. With deepgram:nova-3, speech in another language is usually not transcribed at all. Only enable it when you explicitly need to stop the agent from understanding other languages.'
          title: Strict Language
          type: boolean
        keyterms:
          items:
            type: string
          maxItems: 50
          title: Keyterms
          type: array
      title: PublicAgentAsrConfig
      type: object
    AgentOutboundConfig:
      description: 'Deprecated (2026-09-07): kept for compatibility only. `amd_enabled` and

        `voicemail` no longer change call behavior; outbound calls greet as soon as

        the callee answers, and `answered_by` is always `unknown`.'
      properties:
        amd_enabled:
          default: true
          title: Amd Enabled
          type: boolean
        voicemail:
          anyOf:
          - $ref: '#/components/schemas/AgentOutboundVoicemailConfig'
          - type: 'null'
          default: null
      title: AgentOutboundConfig
