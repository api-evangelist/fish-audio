  /v1/agent/tests:
    get:
      summary: List Tests
      description: 'List your team''s tests, newest first. Filter with `agent_id` to see the

        tests attached to one agent. Paginate with `cursor` (follow `next_cursor`

        while `has_more` is true) or with `page` for offset pagination with a

        `total` count. The two are mutually exclusive.'
      security:
      - BearerAuth: []
      parameters:
      - in: query
        name: search
        description: Case-insensitive match on name.
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Search
        deprecated: false
      - in: query
        name: agent_id
        description: Only tests attached to this agent.
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Agent Id
        deprecated: false
      - in: query
        name: test_type
        description: ''
        required: false
        schema:
          anyOf:
          - enum:
            - next_reply
            - tool
            - simulation
            type: string
          - type: 'null'
          default: null
          title: Test Type
        deprecated: false
      - in: query
        name: cursor
        description: ''
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Cursor
        deprecated: false
      - in: query
        name: page
        description: 1-based page number, mutually exclusive with cursor.
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Page
        deprecated: false
      - in: query
        name: include_total
