  /v1/agent/sessions/{session_id}/end:
    post:
      summary: End Agent Session
      description: 'Hang up a live session: the agent disconnects and the call terminates. The

        session record, transcript, and recording are retained and stay readable.'
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: session_id
        description: ''
        required: true
        schema:
          title: Session Id
          type: string
        deprecated: false
      responses:
        '204':
          description: Request fulfilled, nothing follows
          headers: {}
        '401':
          description: No permission -- see authorization schemes
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
