          - bg
          - sr
          - hr
          - cs
          - sk
          - pl
          - uk
          - ro
          - hu
          - el
          - sv
          - da
          - 'no'
          - fi
          - et
          - lv
          - lt
          - ca
          - he
          - fa
          - ur
          - kk
          - ka
          - hy
          - bn
          - ta
          - te
          - kn
          - mr
          - gu
          - pa
          - ne
          - th
          - vi
          - ms
          - tl
          - af
          title: Speaking Language
          type: string
