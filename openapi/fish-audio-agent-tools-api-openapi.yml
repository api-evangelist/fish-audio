components:
  schemas:
    AgentWebhookHeaderPayload:
      properties:
        name:
          maxLength: 128
          minLength: 1
          title: Name
          type: string
        value:
          maxLength: 4000
          title: Value
          type: string
        kind:
          default: custom
          enum:
          - custom
          - authorization_bearer
          - authorization_basic
          title: Kind
          type: string
      required:
      - name
      - value
      title: AgentWebhookHeaderPayload
      type: object
    PublicToolHeader:
      properties:
        name:
          title: Name
          type: string
        kind:
          enum:
          - custom
          - authorization_bearer
          - authorization_basic
          title: Kind
          type: string
        value:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Header value; null for credential kinds (authorization_bearer / authorization_basic), which are write-only.
          title: Value
        has_secret:
          default: false
          description: Whether a credential value is stored; the value itself is never returned.
          title: Has Secret
          type: boolean
      required:
      - name
      - kind
      title: PublicToolHeader
      type: object
    PublicAgentToolSummary:
      properties:
        tool_id:
          title: Tool Id
          type: string
        workspace_id:
          title: Workspace Id
          type: string
        name:
          title: Name
          type: string
        description:
          default: ''
          title: Description
          type: string
        tool_type:
          enum:
          - webhook
          - client
          title: Tool Type
          type: string
        method:
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          title: Method
          type: string
        url:
          title: Url
          type: string
