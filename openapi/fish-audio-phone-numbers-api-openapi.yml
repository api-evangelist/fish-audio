                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '502':
          description: Invalid responses from another server/proxy
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '503':
          description: The server cannot process the request due to a high load
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
