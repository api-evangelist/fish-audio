openapi: 3.2.0
info:
  title: FishAudio Open Agent Tools API
  version: '1'
servers:
- description: Fish Audio API
  url: https://api.fish.audio
tags:
- name: Agent Tools
paths:
  /v1/agent/tools:
    get:
      summary: List Tools
      description: 'List your team''s tools, newest first. Filter with `agent_id` to see one

        agent''s attached tools. Paginate with `cursor` (follow `next_cursor` while

        `has_more` is true) or with `page` for offset pagination with a `total`

        count — the two are mutually exclusive.'
      security:
      - BearerAuth: []
      parameters:
      - in: query
        name: search
        description: Case-insensitive match on name.
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Search
        deprecated: false
      - in: query
        name: agent_id
        description: Only tools attached to this agent's draft config.
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Agent Id
        deprecated: false
      - in: query
        name: cursor
        description: ''
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Cursor
        deprecated: false
      - in: query
        name: page
        description: 1-based page number; mutually exclusive with cursor.
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Page
        deprecated: false
      - in: query
        name: include_total
        description: ''
        required: false
        schema:
          default: false
          title: Include Total
          type: boolean
        deprecated: false
      - in: query
        name: page_size
        description: ''
        required: false
        schema:
          default: 30
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        deprecated: false
      responses:
        '200':
          description: Request fulfilled, document follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  tools:
                    items:
                      $ref: '#/components/schemas/PublicAgentToolSummary'
                    title: Tools
                    type: array
                  has_more:
                    title: Has More
                    type: boolean
                  next_cursor:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Next Cursor
                  total:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    default: null
                    title: Total
                required:
                - tools
                - has_more
                type: object
        '400':
          description: Bad request syntax or unsupported method
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '401':
          description: No permission -- see authorization schemes
          headers: {}
