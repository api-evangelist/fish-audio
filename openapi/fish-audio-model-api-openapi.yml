openapi: 3.2.0
info:
  title: FishAudio Open Model API
  version: '1'
servers:
- description: Fish Audio API
  url: https://api.fish.audio
tags:
- name: Model
paths:
  /model:
    get:
      summary: List Models
      security:
      - BearerAuth: []
      parameters:
      - in: query
        name: page_size
        description: Page size
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        deprecated: false
      - in: query
        name: page_number
        description: Page number
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page Number
          type: integer
        deprecated: false
      - in: query
        name: title
        description: Title to filter models
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Title
        deprecated: false
      - in: query
        name: tag
        description: Tag to filter models
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: string
          - type: 'null'
          default: null
          title: Tag
        deprecated: false
      - in: query
        name: self
        description: If True, return models owned by the active workspace
        required: false
        schema:
          default: false
          title: Self
          type: boolean
        deprecated: false
      - in: query
        name: author_id
        description: Author ID to filter public models; ignored if self is True
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Author Id
        deprecated: false
      - in: query
        name: language
        description: Language to filter models
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: string
          - type: 'null'
          default: null
          title: Language
        deprecated: false
      - in: query
        name: title_language
        description: Title language to filter models
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: string
          - type: 'null'
          default: null
          title: Title Language
        deprecated: false
      - in: query
        name: licensed
        description: If True, only voices licensed by Fish Audio (rights secured from the voice owner) are returned; ignored if self is True
        required: false
        schema:
          default: false
          title: Licensed
          type: boolean
        deprecated: false
      - in: query
        name: sort_by
        description: ''
        required: false
        schema:
          default: score
          enum:
          - score
          - task_count
          - created_at
          title: Sort By
          type: string
        deprecated: false
      responses:
        '200':
          description: Request fulfilled, document follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  max_offset:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    default: null
                    title: Max Offset
                  accessible_upper_bound:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    default: null
                    title: Accessible Upper Bound
                  window_limited:
                    default: false
                    title: Window Limited
                    type: boolean
                  total_is_exact:
                    default: true
                    title: Total Is Exact
                    type: boolean
                  total:
                    title: Total
                    type: integer
                  items:
                    items:
                      $ref: '#/components/schemas/ModelEntity'
                    title: Items
                    type: array
                  has_more:
                    anyOf:
                    - type: boolean
                    - type: 'null'
                    default: null
                    title: Has More
                required:
                - total
                - items
                type: object
      tags:
      - Model
      operationId: getModel
      x-operation-id-source: derived
    post:
      summary: Create Model for Users via API
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                visibility:
                  default: private
                  description: Model visibility. Public requests are downgraded to private; use the web publish flow to publish publicly. Unlist allows anyone with the link to access, while private is visible only to the creator.
                  enum:
                  - public
                  - unlist
                  - private
                  title: Visibility
                  type: string
                type:
                  const: tts
                  description: Model type, tts is for text to speech
                  title: Type
                  type: string
                title:
                  description: Model title or name
                  title: Title
                  type: string
                description:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: Model description
                  title: Description
                cover_image:
                  anyOf:
                  - format: binary
                    type: string
                  - type: 'null'
                  default: null
                  description: Model cover image, this is required if the model is public
                  title: Cover Image
                train_mode:
                  const: fast
                  description: Model train mode, for TTS model, fast means model instantly available after creation
                  title: Train Mode
                  type: string
                voices:
                  anyOf:
                  - items:
                      format: binary
                      type: string
                    maxItems: 20
                    minItems: 1
                    type: array
                  - format: binary
                    type: string
                  description: Upload voices files that will be used to tune the model
                  title: Voices
                texts:
                  anyOf:
                  - items:
                      type: string
                    maxItems: 20
                    type: array
                  - type: string
                  - type: 'null'
                  default: null
                  description: Texts corresponding to the voices, if unspecified, ASR will be performed on the voices
                  title: Texts
                voice_design_signatures:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: string
                  - type: 'null'
                  default: null
                  description: Signatures from /v1/voice-design candidates, one per voice in the same order. When every uploaded voice verifies, the model is stamped source=voice_design; an invalid signature rejects the request.
                  title: Voice Design Signatures
                tags:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: string
                  - type: 'null'
                  description: Model tags
                  title: Tags
                enhance_audio_quality:
                  default: true
                  description: Enhance audio quality
                  title: Enhance Audio Quality
                  type: boolean
                generate_sample:
                  default: false
                  description: Generate default text
                  title: Generate Sample
                  type: boolean
              required:
              - type
              - title
              - train_mode
              - voices
              type: object
          application/x-www-form-urlencoded:
            schema:
              properties:
                visibility:
                  default: private
                  description: Model visibility. Public requests are downgraded to private; use the web publish flow to publish publicly. Unlist allows anyone with the link to access, while private is visible only to the creator.
                  enum:
                  - public
                  - unlist
                  - private
                  title: Visibility
                  type: string
                type:
                  const: tts
                  description: Model type, tts is for text to speech
                  title: Type
                  type: string
                title:
                  description: Model title or name
                  title: Title
                  type: string
                description:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: Model description
                  title: Description
                cover_image:
                  anyOf:
                  - format: binary
                    type: string
                  - type: 'null'
                  default: null
                  description: Model cover image, this is required if the model is public
                  title: Cover Image
                train_mode:
                  const: fast
                  description: Model train mode, for TTS model, fast means model instantly available after creation
                  title: Train Mode
                  type: string
                voices:
                  anyOf:
                  - items:
                      format: binary
                      type: string
                    maxItems: 20
                    minItems: 1
                    type: array
                  - format: binary
                    type: string
                  description: Upload voices files that will be used to tune the model
                  title: Voices
                texts:
                  anyOf:
                  - items:
                      type: string
                    maxItems: 20
                    type: array
                  - type: string
                  - type: 'null'
                  default: null
                  description: Texts corresponding to the voices, if unspecified, ASR will be performed on the voices
                  title: Texts
                voice_design_signatures:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: string
                  - type: 'null'
                  default: null
                  description: Signatures from /v1/voice-design candidates, one per voice in the same order. When every uploaded voice verifies, the model is stamped source=voice_design; an invalid signature rejects the request.
                  title: Voice Design Signatures
                tags:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: string
                  - type: 'null'
                  description: Model tags
                  title: Tags
                enhance_audio_quality:
                  default: true
                  description: Enhance audio quality
                  title: Enhance Audio Quality
                  type: boolean
                generate_sample:
                  default: false
                  description: Generate default text
                  title: Generate Sample
                  type: boolean
              required:
              - type
              - title
              - train_mode
              - voices
              type: object
          multipart/form-data:
            schema:
              properties:
                visibility:
                  default: private
                  description: Model visibility. Public requests are downgraded to private; use the web publish flow to publish publicly. Unlist allows anyone with the link to access, while private is visible only to the creator.
                  enum:
                  - public
                  - unlist
                  - private
                  title: Visibility
                  type: string
                type:
                  const: tts
                  description: Model type, tts is for text to speech
                  title: Type
                  type: string
                title:
                  description: Model title or name
                  title: Title
                  type: string
                description:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: Model description
                  title: Description
                cover_image:
                  anyOf:
                  - format: binary
                    type: string
                  - type: 'null'
                  default: null
                  description: Model cover image, this is required if the model is public
                  title: Cover Image
                train_mode:
                  const: fast
                  description: Model train mode, for TTS model, fast means model instantly available after creation
                  title: Train Mode
                  type: string
                voices:
                  anyOf:
                  - items:
                      format: binary
                      type: string
                    maxItems: 20
                    minItems: 1
                    type: array
                  - format: binary
                    type: string
                  description: Upload voices files that will be used to tune the model
                  title: Voices
                texts:
                  anyOf:
                  - items:
                      type: string
                    maxItems: 20
                    type: array
                  - type: string
                  - type: 'null'
                  default: null
                  description: Texts corresponding to the voices, if unspecified, ASR will be performed on the voices
                  title: Texts
                voice_design_signatures:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: string
                  - type: 'null'
                  default: null
                  description: Signatures from /v1/voice-design candidates, one per voice in the same order. When every uploaded voice verifies, the model is stamped source=voice_design; an invalid signature rejects the request.
                  title: Voice Design Signatures
                tags:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: string
                  - type: 'null'
                  description: Model tags
                  title: Tags
                enhance_audio_quality:
                  default: true
                  description: Enhance audio quality
                  title: Enhance Audio Quality
                  type: boolean
                generate_sample:
                  default: false
                  description: Generate default text
                  title: Generate Sample
                  type: boolean
              required:
              - type
              - title
              - train_mode
              - voices
              type: object
          application/msgpack:
            schema:
              properties:
                visibility:
                  default: private
                  description: Model visibility. Public requests are downgraded to private; use the web publish flow to publish publicly. Unlist allows anyone with the link to access, while private is visible only to the creator.
                  enum:
                  - public
                  - unlist
                  - private
                  title: Visibility
                  type: string
                type:
                  const: tts
                  description: Model type, tts is for text to speech
                  title: Type
                  type: string
                title:
                  description: Model title or name
                  title: Title
                  type: string
                description:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: Model description
                  title: Description
                cover_image:
                  anyOf:
                  - format: binary
                    type: string
                  - type: 'null'
                  default: null
                  description: Model cover image, this is required if the model is public
                  title: Cover Image
                train_mode:
