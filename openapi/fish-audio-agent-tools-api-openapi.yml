    delete:
      summary: Delete Tool
      description: 'Delete a tool. Returns 409 while any agent''s draft configuration still

        references it — check `GET /v1/agent/tools/{tool_id}/agents` and detach it

        via the agent config first, so a delete can never silently change agent

        behavior.'
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: tool_id
        description: ''
        required: true
        schema:
