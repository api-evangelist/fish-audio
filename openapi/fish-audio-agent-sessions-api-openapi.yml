  /v1/agent/sessions/{session_id}/recording:
    get:
      summary: Get Agent Session Recording
      description: 'Return time-limited download URLs for the session''s audio recording, one

        per speaker track (agent and user are recorded separately).'
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: session_id
        description: ''
        required: true
        schema:
          title: Session Id
          type: string
        deprecated: false
      responses:
        '200':
          description: Request fulfilled, document follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  session_id:
                    title: Session Id
                    type: string
                  status:
                    enum:
                    - processing
                    - complete
                    - failed
                    title: Status
                    type: string
                  tracks:
                    items:
                      $ref: '#/components/schemas/AgentSessionRecordingTrackEntity'
                    title: Tracks
                    type: array
                  transfers:
                    items:
                      $ref: '#/components/schemas/AgentSessionTransferRecordingEntity'
                    title: Transfers
                    type: array
                  error:
