      tags:
      - Agent Sessions
      x-codeSamples:
      - lang: bash
        label: Create Session
        source: "curl --request POST \\\n  --url https://api.fish.audio/v1/agent/sessions \\\n  --header 'Authorization: Bearer <token>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"agent_id\": \"<agent-id>\"\n  }'"
      operationId: postV1AgentSessions
      x-operation-id-source: derived
  /v1/agent/sessions/{session_id}:
    get:
      summary: Get Agent Session
      description: 'Fetch one session''s full detail: status, timing, and the conversation

        timeline (transcript turns interleaved with tool calls, in order).'
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: session_id
        description: ''
        required: true
        schema:
          title: Session Id
          type: string
        deprecated: false
      responses:
        '200':
          description: Request fulfilled, document follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  session_id:
                    title: Session Id
                    type: string
                  agent_id:
                    title: Agent Id
                    type: string
                  agent_name:
                    title: Agent Name
                    type: string
                  name:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Name
                  end_user_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: End User Id
                  status:
                    enum:
                    - pending
                    - active
                    - completed
                    - failed
                    - unknown
                    title: Status
                    type: string
                  end_reason:
                    anyOf:
                    - enum:
                      - user_hangup
                      - agent_hangup
                      - escalated
                      - conversation_timeout
                      - heartbeat_timeout
                      - agent_join_timeout
                      - internal_error
                      - llm_endpoint_failure
                      - room_join_timeout
                      - cancelled
                      - dial_failed
                      type: string
                    - type: 'null'
                    default: null
                    title: End Reason
                  source:
                    enum:
                    - api_key
                    - dashboard
                    - public
                    - phone
                    title: Source
                    type: string
                  direction:
                    default: inbound
                    enum:
                    - inbound
                    - outbound
                    title: Direction
                    type: string
                  dial_status:
                    anyOf:
                    - enum:
                      - answered
                      - busy
                      - no_answer
                      - failed
                      type: string
                    - type: 'null'
                    default: null
                    title: Dial Status
                  answered_by:
                    anyOf:
                    - enum:
                      - human
                      - voicemail
                      - unknown
                      type: string
                    - type: 'null'
                    default: null
                    title: Answered By
                  caller_number:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Caller Number
                  dialed_number:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Dialed Number
                  sip_call_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Sip Call Id
                  timezone:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Timezone
                  created_at:
                    title: Created At
                    type: string
                  started_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Started At
                  ended_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Ended At
                  duration_seconds:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    default: null
                    title: Duration Seconds
                  participant_identity:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Participant Identity
                  agent_participant_identity:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Agent Participant Identity
                  agent_joined_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Agent Joined At
                  metadata:
                    additionalProperties:
                      $ref: '#/components/schemas/JsonValue'
                    title: Metadata
                    type: object
                  content_purged_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Content Purged At
                  keypad_menu:
                    anyOf:
                    - $ref: '#/components/schemas/AgentSessionKeypadMenu'
                    - type: 'null'
                    default: null
                  unattributed_llm_usage:
                    items:
                      $ref: '#/components/schemas/LLMMessageUsage'
                    title: Unattributed Llm Usage
                    type: array
                  items:
                    items:
                      discriminator:
                        mapping:
                          message: '#/components/schemas/AgentSessionMessageItem'
                          tool_call: '#/components/schemas/AgentSessionToolCallItem'
                          tool_result: '#/components/schemas/AgentSessionToolResultItem'
                          transfer: '#/components/schemas/AgentSessionTransferItem'
                        propertyName: type
                      oneOf:
                      - $ref: '#/components/schemas/AgentSessionMessageItem'
                      - $ref: '#/components/schemas/AgentSessionToolCallItem'
                      - $ref: '#/components/schemas/AgentSessionTransferItem'
                      - $ref: '#/components/schemas/AgentSessionToolResultItem'
                    title: Items
                    type: array
                  analysis:
                    anyOf:
                    - $ref: '#/components/schemas/AgentSessionAnalysisResult'
                    - type: 'null'
                    default: null
                required:
