                generate_sample:
                  default: false
                  description: Generate default text
                  title: Generate Sample
                  type: boolean
              required:
              - type
              - title
              - train_mode
              - voices
              type: object
      responses:
        '201':
          description: Document created, URL follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  _id:
                    title: Id
                    type: string
                  type:
                    enum:
                    - svc
                    - tts
                    title: Type
                    type: string
                  title:
                    title: Title
                    type: string
                  description:
                    default: ''
                    title: Description
                    type: string
                  cover_image:
                    default: ''
                    title: Cover Image
                    type: string
                  train_mode:
                    default: full
                    enum:
                    - fast
                    - full
                    title: Train Mode
                    type: string
                  state:
                    enum:
                    - created
                    - training
                    - trained
                    - failed
                    title: State
                    type: string
                  tags:
                    items:
                      type: string
                    title: Tags
                    type: array
                  samples:
                    default: []
                    items:
                      $ref: '#/components/schemas/SampleEntity'
                    title: Samples
                    type: array
                  created_at:
                    format: date-time
                    title: Created At
                    type: string
                  updated_at:
                    format: date-time
                    title: Updated At
                    type: string
                  languages:
                    default: []
                    items:
                      type: string
                    title: Languages
                    type: array
                  visibility:
                    enum:
                    - public
                    - unlist
                    - private
