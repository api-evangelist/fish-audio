components:
  schemas:
    PublicPostCallWebhook:
      properties:
        url:
          title: Url
          type: string
        has_secret:
          default: false
          description: Whether a signing secret is configured; the value itself is never returned.
          title: Has Secret
          type: boolean
      required:
      - url
      title: PublicPostCallWebhook
      type: object
    AgentKeypadMenu:
      description: 'Keypad menu for inbound phone calls. Before the agent''s first turn it

        speaks `prompt` in the agent''s voice, collects one key press (or, with

        `accept_speech`, the option''s value said aloud) and stores the chosen

        option''s `value` in the dynamic variable named by `variable`. The system

        prompt, first message, transfer texts, farewell and webhook tools can use

        `{{variable}}` to act on the choice. Outbound calls, web, API and test

        sessions skip the menu, and the variable renders from its default.'
      properties:
        enabled:
          default: false
          title: Enabled
          type: boolean
        prompt:
          default: ''
          title: Prompt
          type: string
        options:
          default: []
          items:
            $ref: '#/components/schemas/AgentKeypadMenuOption'
          title: Options
          type: array
        accept_speech:
          default: true
          title: Accept Speech
          type: boolean
        variable:
          default: menu_choice
          title: Variable
          type: string
        no_input_timeout_seconds:
          default: 5
          title: No Input Timeout Seconds
          type: integer
        max_attempts:
          default: 2
          title: Max Attempts
          type: integer
        retry_message:
          default: ''
          title: Retry Message
          type: string
        fallback_value:
          default: ''
          title: Fallback Value
          type: string
      title: AgentKeypadMenu
      type: object
    PublicAgentLLMPatch:
      additionalProperties: false
      properties:
        model:
          anyOf:
          - enum:
            - google/gemini-3.5-flash-lite
            - google/gemini-3.6-flash
            - google/gemini-3.8-flash
            - google/gemini-2.5-flash
            - google/gemma-4-26b-a4b-it
            - anthropic/claude-haiku-4.5
            - anthropic/claude-sonnet-4.6
            - anthropic/claude-opus-5.5
            - anthropic/claude-fable-5.1
            - openai/gpt-5.6-luna
            - openai/gpt-6-luna
            - openai/gpt-5
            - openai/gpt-6.1-sol
            - openai/gpt-6-astra
            - openai/gpt-4o
            - openai/gpt-4.1
            type: string
          - type: 'null'
          default: null
          title: Model
        custom:
          anyOf:
          - $ref: '#/components/schemas/PublicAgentLLMCustomConfig'
          - type: 'null'
          default: null
          description: Your own OpenAI-compatible endpoint; mutually exclusive with `model`, explicit null reverts to the platform model.
      title: PublicAgentLLMPatch
