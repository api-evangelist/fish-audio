openapi: 3.2.0
info:
  title: FishAudio Open Phone Numbers API
  version: '1'
servers:
- description: Fish Audio API
  url: https://api.fish.audio
tags:
- name: Phone Numbers
paths:
  /v1/agent/available-phone-numbers:
    get:
      summary: Search Available Phone Numbers
      description: 'Search the purchasable number inventory. Buy an entry with

        `POST /v1/agent/phone-numbers`; availability is not a reservation, so a listed

        number can still be claimed by someone else first.'
      security:
      - BearerAuth: []
      parameters:
      - in: query
        name: country_code
        description: ISO 3166-1 alpha-2 country code; `US` or `CA`.
        required: false
        schema:
          default: US
          title: Country Code
          type: string
        deprecated: false
      - in: query
        name: area_code
        description: Restrict to one area code, e.g. 415.
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Area Code
        deprecated: false
      - in: query
        name: number_type
        description: The managed inventory is US/CA local numbers only; `toll_free` currently returns 400.
        required: false
        schema:
          default: local
          enum:
          - local
          - toll_free
          title: Number Type
          type: string
        deprecated: false
      - in: query
        name: provider
        description: Inventory to search. Only the managed `twilio` inventory (call-transfer support) is available; the parameter is kept so importing your own numbers can extend it later.
        required: false
        schema:
          anyOf:
          - const: twilio
            type: string
          - type: 'null'
          default: null
          title: Provider
        deprecated: false
      responses:
        '200':
          description: Request fulfilled, document follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  available_phone_numbers:
                    description: Inventory entries forwarded from the provider (number, region, pricing).
                    items:
                      additionalProperties: true
                      type: object
                    title: Available Phone Numbers
                    type: array
                required:
                - available_phone_numbers
                type: object
        '400':
          description: Bad request syntax or unsupported method
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '401':
          description: No permission -- see authorization schemes
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '502':
          description: Invalid responses from another server/proxy
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '503':
          description: The server cannot process the request due to a high load
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
      tags:
      - Phone Numbers
      operationId: getV1AgentAvailablePhoneNumbers
      x-operation-id-source: derived
  /v1/agent/phone-numbers:
    get:
      summary: List Phone Numbers
      description: 'List your team''s phone numbers, newest first. Released numbers are gone

        for good and never appear. Look an id up by E.164 with `phone_number`, or

        filter with `agent_id` to see one agent''s numbers. Paginate with `cursor`

        (follow `next_cursor` while `has_more` is true) or with `page` for offset

        pagination with a `total` count — the two are mutually exclusive.'
      security:
      - BearerAuth: []
      parameters:
      - in: query
        name: phone_number
        description: Exact E.164 match, e.g. +14155550123.
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Phone Number
        deprecated: false
      - in: query
        name: agent_id
        description: Only numbers bound to this agent.
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Agent Id
        deprecated: false
      - in: query
        name: cursor
        description: ''
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Cursor
        deprecated: false
      - in: query
        name: page
        description: 1-based page number; mutually exclusive with cursor.
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Page
        deprecated: false
      - in: query
        name: include_total
        description: ''
        required: false
        schema:
          default: false
          title: Include Total
          type: boolean
        deprecated: false
      - in: query
        name: page_size
        description: ''
        required: false
        schema:
          default: 30
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        deprecated: false
      responses:
        '200':
          description: Request fulfilled, document follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  phone_numbers:
                    items:
                      $ref: '#/components/schemas/PublicPhoneNumberEntity'
                    title: Phone Numbers
                    type: array
                  has_more:
                    title: Has More
                    type: boolean
                  next_cursor:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Next Cursor
                  total:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    default: null
                    title: Total
                required:
                - phone_numbers
                - has_more
                type: object
        '400':
          description: Bad request syntax or unsupported method
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '401':
          description: No permission -- see authorization schemes
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '404':
          description: Nothing matches the given URI
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '503':
          description: The server cannot process the request due to a high load
