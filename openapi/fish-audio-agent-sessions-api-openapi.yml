openapi: 3.2.0
info:
  title: FishAudio Open Agent Sessions API
  version: '1'
servers:
- description: Fish Audio API
  url: https://api.fish.audio
tags:
- name: Agent Sessions
paths:
  /v1/agent/sessions:
    get:
      summary: List Agent Sessions
      description: 'List your team''s sessions, newest first. Filter by agent, status, end

        reason, caller number, SIP Call-ID, end user ID, or creation time.

        Paginate with `cursor` (recommended; follow `next_cursor` while `has_more`

        is true) or with `page` for offset pagination with a `total` count. The

        two are mutually exclusive.'
      security:
      - BearerAuth: []
      parameters:
      - in: query
        name: agent_id
        description: ''
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Agent Id
        deprecated: false
      - in: query
        name: status
        description: 'Comma-separated status filter (pending/active/completed/failed/unknown). Default: every status.'
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Status
        deprecated: false
      - in: query
        name: end_reason
        description: Comma-separated end reason filter (user_hangup/agent_hangup/escalated/conversation_timeout/heartbeat_timeout/agent_join_timeout/internal_error/llm_endpoint_failure/room_join_timeout/cancelled/dial_failed).
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: End Reason
        deprecated: false
      - in: query
        name: direction
        description: Filter by call direction (inbound/outbound). Sessions predating the field count as inbound.
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Direction
        deprecated: false
      - in: query
        name: caller_number
        description: Exact-match caller E.164 (phone sessions only).
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Caller Number
        deprecated: false
      - in: query
        name: sip_call_id
        description: Exact-match SIP Call-ID of the call's INVITE, for looking up the session behind a carrier CDR entry (phone sessions only).
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Sip Call Id
        deprecated: false
      - in: query
        name: end_user_id
        description: Exact-match end_user_id set at session creation.
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: End User Id
        deprecated: false
      - in: query
        name: created_after
        description: ''
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created After
        deprecated: false
      - in: query
        name: created_before
        description: ''
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created Before
        deprecated: false
      - in: query
        name: cursor
        description: ''
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Cursor
        deprecated: false
      - in: query
        name: page
        description: 1-based page number (offset pagination). Returns total; mutually exclusive with cursor, which deep scans must use.
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Page
        deprecated: false
      - in: query
        name: include_total
        description: Also count the filtered set on the cursor path.
        required: false
        schema:
          default: false
          title: Include Total
          type: boolean
        deprecated: false
      - in: query
        name: page_size
        description: ''
        required: false
        schema:
          default: 30
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        deprecated: false
      responses:
        '200':
          description: Request fulfilled, document follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  sessions:
                    items:
                      $ref: '#/components/schemas/AgentSessionSummary'
                    title: Sessions
                    type: array
                  has_more:
                    title: Has More
                    type: boolean
                  next_cursor:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Next Cursor
                  total:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    default: null
                    title: Total
                required:
                - sessions
                - has_more
                type: object
        '400':
          description: Bad request syntax or unsupported method
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '401':
          description: No permission -- see authorization schemes
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '503':
          description: The server cannot process the request due to a high load
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
      tags:
      - Agent Sessions
      operationId: getV1AgentSessions
      x-operation-id-source: derived
    post:
      summary: Create Agent Session
      description: 'Start a conversation session with an agent and receive a join token for the

        session transport (currently LiveKit WebRTC). Authenticate with an API key to

        start sessions with any agent in your team; without credentials only agents

        published as public are reachable, and the request `Origin` must match the

        agent''s allowed origins.


        `language` (and `overrides.language`) accepts `en`, `ja`, `zh`, `ko`, `es`,

        `fr`, `de`, `pt`, `it`, `nl`; anything else is 422. Omit it to use the agent''s configured

        speaking language.


        `overrides.asr.model` picks the speech recognition model for this session,

        nested like the agent config''s `asr` section and with the same values as

        `asr.model`. It needs an API key. A model in preview is 403 unless your

        team has access or the agent already uses it.'
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: origin
        description: ''
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Origin
        deprecated: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionCreatePayload'
      responses:
        '201':
          description: Document created, URL follows
          headers: {}
          content:
            application/json:
              schema:
                description: Wire twin of @fishaudio/agent-protocol `SessionToken` (session.ts); keep in sync.
                properties:
                  session_id:
                    title: Session Id
                    type: string
                  expires_at:
                    title: Expires At
                    type: string
                  max_duration_seconds:
                    title: Max Duration Seconds
                    type: integer
                  transport:
                    const: livekit
                    title: Transport
                    type: string
                  livekit_url:
                    title: Livekit Url
                    type: string
                  token:
                    title: Token
                    type: string
                required:
                - session_id
                - expires_at
                - max_duration_seconds
                - transport
                - livekit_url
                - token
                type: object
        '400':
          description: Bad request syntax or unsupported method
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
