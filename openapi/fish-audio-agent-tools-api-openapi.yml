      tags:
      - Agent Tools
      operationId: getV1AgentTools
      x-operation-id-source: derived
    post:
      summary: Create Tool
      description: 'Create a workspace tool. `tool_type: webhook` calls your HTTP endpoint

        during conversations; `tool_type: client` is executed by your own frontend

        through the SDK (no URL). Attach it to agents via the agent config''s

        `tools.tool_ids`. Credential headers (authorization_bearer /

        authorization_basic) are write-only and read back as `has_secret`.'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAgentToolCreatePayload'
      responses:
        '201':
          description: Document created, URL follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  tool_id:
                    title: Tool Id
                    type: string
                  workspace_id:
                    title: Workspace Id
                    type: string
                  name:
                    title: Name
                    type: string
                  description:
                    default: ''
                    title: Description
                    type: string
                  tool_type:
                    enum:
                    - webhook
                    - client
                    title: Tool Type
                    type: string
                  method:
                    enum:
                    - GET
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                    title: Method
                    type: string
                  url:
                    title: Url
                    type: string
                  used_by:
                    default: 0
                    description: How many agents reference this tool in their draft configuration.
                    title: Used By
                    type: integer
                  created_at:
                    format: date-time
                    title: Created At
                    type: string
                  updated_at:
                    format: date-time
                    title: Updated At
                    type: string
                  arguments:
                    items:
                      $ref: '#/components/schemas/AgentWebhookArgumentPayload'
                    title: Arguments
                    type: array
                  content_type:
                    title: Content Type
                    type: string
                  body_template:
                    default: ''
                    title: Body Template
                    type: string
                  headers:
                    items:
                      $ref: '#/components/schemas/PublicToolHeader'
                    title: Headers
                    type: array
                  timeout_seconds:
