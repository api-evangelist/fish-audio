  /v1/agent/tools/{tool_id}/agents:
    get:
      summary: List Agents Using Tool
      description: 'Every agent whose draft configuration references this tool — the

        pre-flight check before a delete. Published versions keep executing their

        frozen tool snapshot, so only draft references block deletion.'
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: tool_id
        description: ''
        required: true
        schema:
          title: Tool Id
          type: string
        deprecated: false
      responses:
        '200':
          description: Request fulfilled, document follows
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  agents:
                    description: Agents that reference this resource in their configuration.
                    items:
                      $ref: '#/components/schemas/PublicDependentAgent'
                    title: Agents
                    type: array
                  total:
                    title: Total
                    type: integer
                required:
                - agents
                - total
                type: object
