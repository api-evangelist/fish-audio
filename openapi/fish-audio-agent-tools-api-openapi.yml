                  error_handling:
                    enum:
                    - passthrough
                    - hide
                    title: Error Handling
                    type: string
                  mock_responses:
                    items:
                      $ref: '#/components/schemas/AgentWebhookMockResponsePayload'
                    title: Mock Responses
                    type: array
                  expects_response:
                    default: true
                    title: Expects Response
                    type: boolean
                  execution_mode:
                    default: blocking
                    enum:
                    - blocking
                    - fire_and_forget
                    - background
                    title: Execution Mode
                    type: string
                required:
                - tool_id
                - workspace_id
                - name
                - tool_type
                - method
                - url
                - created_at
                - updated_at
                - content_type
                - timeout_seconds
                - error_handling
                type: object
        '401':
          description: No permission -- see authorization schemes
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  status:
                    title: Status
                    type: integer
                  message:
                    title: Message
                    type: string
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                required:
                - status
                - message
                type: object
        '422':
          description: ''
          headers: {}
