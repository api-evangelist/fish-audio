    AgentSessionTransferItem:
      description: 'One transfer attempt. `call_id` matches its `_transfer_call` tool_call

        item. A warm transfer''s consult call (the caller on hold meanwhile) is in

        `messages`, never in the caller''s message items. `merged` and `referred`

        succeeded, and `outcome` is null while the attempt runs.'
      properties:
        type:
          const: transfer
          default: transfer
          title: Type
          type: string
        call_id:
          title: Call Id
          type: string
        destination:
          title: Destination
          type: string
        destination_type:
          enum:
          - phone
          - sip
          title: Destination Type
          type: string
        target:
          title: Target
          type: string
        mode:
          enum:
          - cold
          - warm
          title: Mode
          type: string
        warm_connect:
          anyOf:
          - enum:
            - confirm
            - briefing
            - direct
            type: string
          - type: 'null'
          default: null
          title: Warm Connect
        outcome:
          anyOf:
          - enum:
            - merged
            - referred
            - dial_failed
            - declined
            - voicemail
            - ivr
            - consult_closed
            - consult_timeout
            - merge_failed
            - refer_failed
            - caller_hangup
            - cancelled
            - unavailable
            type: string
          - type: 'null'
          default: null
          title: Outcome
        sip_status:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: 'dial_failed and refer_failed: the final SIP response code the carrier gave. Null when it gave none.'
          title: Sip Status
        dial_status:
          anyOf:
          - enum:
            - busy
            - no_answer
            - failed
            type: string
          - type: 'null'
          default: null
          description: 'dial_failed and refer_failed: why the transfer target could not be reached, classified from sip_status the same way as an outbound call''s dial_status.'
          title: Dial Status
        decline_reason:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 'declined: the agent''s summary of why the transfer target declined. Null when none was given. What they actually said is in messages.'
          title: Decline Reason
        consult_end_reason:
          anyOf:
          - enum:
            - transfer_target_hangup
            - connection_lost
            type: string
          - type: 'null'
          default: null
          description: 'consult_closed: how the consult call ended before the caller was connected. Null when it cannot be told.'
          title: Consult End Reason
        hold_started_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Hold Started At
        hold_ended_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Hold Ended At
        dial_started_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Dial Started At
        answered_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Answered At
        ended_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Ended At
        transferred_call_ended_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 'merged and referred: when the call between the caller and the transfer target ended. Null while it is still on. A cold transfer waits for the carrier''s call record (up to about an hour) and stays null on imported SIP numbers.'
          title: Transferred Call Ended At
        transferred_call_duration_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: 'merged and referred: how long the caller talked with the transfer target. Warm: from ended_at to transferred_call_ended_at. Cold: the carrier''s call record, 0 when the target never really answered.'
          title: Transferred Call Duration Seconds
        transferred_call_end_reason:
          anyOf:
          - enum:
            - caller_hangup
            - transfer_target_hangup
            - conversation_timeout
            - connection_lost
            type: string
          - type: 'null'
          default: null
          description: 'merged: how the call between the caller and the transfer target ended. caller_hangup: the caller hung up (on an outbound call, the person the agent called). transfer_target_hangup: the transfer target hung up. conversation_timeout: the call reached the agent''s maximum call duration, counted from the start of the call. connection_lost: a line dropped, nobody hung up. Null when it cannot be told, and always null on a cold transfer.'
          title: Transferred Call End Reason
        messages:
          items:
            $ref: '#/components/schemas/AgentSessionTransferMessage'
          title: Messages
          type: array
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
      required:
      - call_id
      - destination
      - destination_type
      - target
      - mode
      title: AgentSessionTransferItem
      type: object
