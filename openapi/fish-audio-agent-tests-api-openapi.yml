  /v1/agent/agents/{agent_id}/tests/run:
    post:
      summary: Run Tests
      description: 'Start a batch that runs the agent''s attached tests against its current

        draft, one run per test and repeat. A simulation test repeats

        `simulation.repeat_count` times, and a `repeat_count` in the body repeats

        every selected test that many times instead. A batch starts at most 1000

        runs. Runs are queued and finish in the background, simulations take

        minutes. Poll `GET /v1/agent/agents/{agent_id}/test-batches/{batch_id}`

        until `completed` is true, then gate on `pass_rate`, which leaves out

        `error` runs.


        Each simulation run that ends `passed` or `failed` is billed: a platform

        fee per agent reply plus the LLM tokens of the agent, the simulated user

        and the judge. `error` runs are not billed. A batch with a simulation

        test returns 402 when the account has no trial balance or API credit

        left, and 403 when the team''s agreement does not allow agent usage.'
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: agent_id
        description: ''
        required: true
        schema:
          title: Agent Id
          type: string
        deprecated: false
      responses:
        '202':
          description: Request accepted, processing continues off-line
          headers: {}
          content:
            application/json:
              schema:
                properties:
                  batch_id:
                    title: Batch Id
                    type: string
                  agent_id:
                    title: Agent Id
                    type: string
                  status:
                    description: running until every run has finished.
                    enum:
                    - running
                    - completed
                    title: Status
                    type: string
                  completed:
                    title: Completed
                    type: boolean
                  passed:
                    title: Passed
                    type: integer
                  failed:
                    title: Failed
                    type: integer
                  errors:
                    title: Errors
                    type: integer
                  pass_rate:
                    anyOf:
                    - type: number
                    - type: 'null'
                    default: null
                    description: passed / (passed + failed), null until a run passed or failed. Error runs never judged the agent and are left out.
                    title: Pass Rate
                  runs:
                    items:
                      $ref: '#/components/schemas/PublicAgentTestRun'
                    title: Runs
                    type: array
                required:
                - batch_id
                - agent_id
                - status
                - completed
                - passed
                - failed
                - errors
                - runs
                type: object
        '400':
          description: Bad request syntax or unsupported method
          headers: {}
          content:
            application/json:
              schema:
